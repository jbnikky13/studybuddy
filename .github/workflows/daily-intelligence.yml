name: Refresh pharmacy intelligence digest
# The digest output JSON is intentionally excluded from push paths to prevent loops.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-intelligence.js'
      - 'daily-feed.js'
      - '.github/workflows/daily-intelligence.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: studybuddy-pharmacy-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh and commit digest safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/update-intelligence.js
            if git diff --quiet -- data/latest-intelligence.json; then
              echo "Digest has not changed."
              exit 0
            fi
            git add data/latest-intelligence.json
            git commit -m "Refresh daily pharmacy intelligence digest"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during the refresh; retrying from the latest main."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Unable to publish the digest after three attempts." >&2
          exit 1
