name: Refresh pharmacy intelligence digest
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-intelligence.js'
      - 'daily-feed.js'
      - '.github/workflows/daily-intelligence.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

  # The digest output JSON is intentionally excluded from push paths to prevent loops.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest PubMed records
        run: node scripts/update-intelligence.js
      - name: Commit changed digest
        run: |
          if git diff --quiet -- data/latest-intelligence.json; then
            echo "Digest has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-intelligence.json
          git commit -m "Refresh daily pharmacy intelligence digest"
          git push
